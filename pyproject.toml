[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionlab-datasets"         # <-- avoid conflict with HF 'datasets'
dynamic = ["version"]
description = "Visionlab dataset registry and preparation utilities for slipstream"
readme = "README.md"
authors = [
    {name = "George Alvarez", email = "grez72@gmail.com"}
]
requires-python = ">=3.10,<3.13"

dependencies = [
    # Slipstream data loader
    "visionlab-slipstream@git+https://github.com/harvard-visionlab/slipstream.git@main",

    # Torch stack (for preprocessing transforms)
    "torch>=2.1.0",
    "torchvision>=0.16.0",

    # Image utilities
    "pillow",
    "numpy",
]

[project.scripts]
visionlab-datasets = "visionlab.datasets.cli:main"

[dependency-groups]
video = [
    # SpatialVID video stores: decode + prep (needs FFmpeg shared libs for torchcodec; PyAV bundles its own)
    "torchcodec",
    # torchcodec's CUDA build dlopens NVIDIA NPP; ship it via pip instead of a system CUDA install
    "nvidia-npp-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "av",
    "pandas",
    "pyarrow",
    "scipy",
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "ipykernel",
    "nbstripout",
    "ipywidgets",
    "pandas",
    "seaborn",
    "matplotlib",
    "jupyterlab",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchcodec = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.dynamic]
version = {attr = "datasets.version.__version__"}

[tool.setuptools]
# We map the top-level import 'visionlab.datasets' to your folder 'datasets'
package-dir = { "visionlab.datasets" = "datasets", "visionlab.datasets.downloads" = "datasets/downloads", "visionlab.datasets.prep" = "datasets/prep", "visionlab.datasets.prep.spatialvid_hq" = "datasets/prep/spatialvid_hq", "visionlab.datasets._configs" = "datasets/_configs" }
packages = [
  "visionlab.datasets",
  "visionlab.datasets._configs",
  "visionlab.datasets.prep",
  "visionlab.datasets.prep.spatialvid_hq",
  "visionlab.datasets.downloads",
]
